name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-workflow-json:
    name: Validate n8n workflow JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workflow JSON is valid
        run: |
          set -e
          if ! ls workflows/*.json >/dev/null 2>&1; then
            echo "No workflow JSON files found in workflows/"
            exit 1
          fi
          for f in workflows/*.json; do
            echo "Validating $f"
            python -m json.tool "$f" > /dev/null
          done

  no-secrets-in-workflow:
    name: No hardcoded secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for common secret patterns
        run: |
          if grep -REln '(AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}|[0-9]{8,10}:[A-Za-z0-9_-]{30,})' workflows/ 2>/dev/null; then
            echo "Possible secrets found in workflow JSON"
            exit 1
          fi
          echo "No obvious secrets found"

  # Include only when scripts/*.py exist
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if Python sources exist
        id: py
        run: |
          if ls scripts/*.py >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No scripts/*.py — skipping ruff/black"
          fi
      - name: Set up Python
        if: steps.py.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        if: steps.py.outputs.exists == 'true'
        run: pip install ruff black
      - name: Run ruff
        if: steps.py.outputs.exists == 'true'
        run: ruff check scripts/
      - name: Check formatting with black
        if: steps.py.outputs.exists == 'true'
        run: black --check scripts/